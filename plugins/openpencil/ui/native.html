<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenPencil · Редактор Codex</title><style>
:root{color-scheme:dark;--surface:#202022;--line:#444448;--text:#f1f1f2;--muted:#aaa;--base:#18181b}html[data-theme=light]{color-scheme:light;--surface:#fff;--line:#d2d2d7;--text:#18181b;--muted:#64646a;--base:#f4f4f5}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--base);color:var(--text);font:13px system-ui}#op{display:block}#boot{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:var(--base);z-index:5;gap:12px}#boot[hidden],[hidden]{display:none!important}#boot strong{font-size:20px}#boot-status{color:var(--muted);max-width:520px;padding:0 25px;white-space:pre-wrap}button,input{font:inherit}button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #3980f7;outline-offset:3px}button.primary{background:#2868dd;border-color:#2868dd;color:white}#runtime-error,#operation-status{position:fixed;bottom:14px;left:14px;max-width:min(510px,calc(100vw - 52px));z-index:8;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;white-space:pre-wrap;box-shadow:0 5px 24px #0003}#operation-status{display:flex;gap:12px;align-items:center}#operation-status[data-error=true],#runtime-error{border-color:#cf6666}#status-dismiss{padding:0 4px;border:0;background:none;font-size:18px}dialog{width:min(440px,calc(100vw - 64px));padding:24px;border:1px solid var(--line);border-radius:16px;color:var(--text);background:var(--surface);box-shadow:0 20px 70px #0007}dialog::backdrop{background:#0006}dialog h2{font-size:19px;margin:0 0 8px}dialog p{color:var(--muted);line-height:1.5;margin:0 0 20px}label{display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--base);color:var(--text)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
/* WORKSPACE_CSS */
</style></head><body><header id="workspace-bar" aria-label="Работа с Codex"><button id="workspace-project" type="button" aria-expanded="false" aria-controls="workspace-drawer">Проект</button><button id="workspace-context" type="button" aria-expanded="false" aria-controls="workspace-drawer">Контекст · 0</button><button id="workspace-comment" type="button" aria-expanded="false" aria-controls="workspace-drawer" disabled>Комментировать</button><button id="workspace-comments" type="button" aria-expanded="false" aria-controls="workspace-drawer">Комментарии</button><button id="workspace-agents" type="button" aria-expanded="false" aria-controls="workspace-drawer">Агенты · 0</button><button id="workspace-fit" type="button">Уместить</button><button id="workspace-expand" type="button">Развернуть</button></header><main id="editor-viewport"><canvas id="op" aria-label="Полный редактор OpenPencil" tabindex="0"></canvas></main><aside id="workspace-drawer" aria-label="Панель проекта" hidden></aside><div id="boot"><strong>OpenPencil</strong><span id="boot-status">Запуск редактора…</span></div><div id="runtime-error" role="alert" hidden></div><div id="operation-status" role="status" aria-live="polite" hidden><span id="status-message"></span><button id="status-dismiss" aria-label="Закрыть уведомление">×</button></div><dialog id="save-dialog" aria-labelledby="save-title"><form id="save-form"><h2 id="save-title">Сохранить макет</h2><p>Выберите путь для файла .op внутри этого проекта.</p><label for="save-path">Путь к файлу</label><input id="save-path" required autocomplete="off" spellcheck="false" placeholder="/…/Мой макет.op"><div class="actions"><button id="save-cancel" type="button">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></dialog><script>/* NATIVE_SCRIPT */</script></body></html>
